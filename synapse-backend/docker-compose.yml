# Full Synapse platform per the understanding doc:
#   Postgres (metadata) · Redis (cache/broker) · Qdrant (vectors) · MinIO (S3)
#   grpc (SynapseService) · api (FastAPI REST + web dashboard) · worker (Celery)
#
#   docker compose up --build
#
# The CLI connects to the gRPC service on localhost:50051 and the REST API on
# localhost:8000 (set backend_url/api_url in the CLI's config.json accordingly).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create DB tables, seed a dev API key, ensure S3 bucket + Qdrant collection.
  init:
    image: synapse-backend:local
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      qdrant: { condition: service_started }
    command: python -m synapse_backend.scripts_entry init
    restart: "no"

  grpc:
    build:
      context: .
      dockerfile: Dockerfile
    image: synapse-backend:local   # built once here; api/worker/init reuse this tag
    env_file: .env
    ports:
      - "50051:50051"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
    command: python -m synapse_backend.grpc_service.server

  api:
    image: synapse-backend:local
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn synapse_backend.api.app:app --host 0.0.0.0 --port 8000

  worker:
    image: synapse-backend:local
    env_file: .env
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    command: celery -A synapse_backend.tasks.celery_app worker --loglevel=INFO

volumes:
  pgdata:
  qdrantdata:
  miniodata:
