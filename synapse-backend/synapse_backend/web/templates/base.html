<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Synapse{% endblock %}</title>
  <style>
    :root {
      --teal: #0f766e; --teal-dark: #115e59; --teal-light: #ccfbf1;
      --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --danger: #dc2626; --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5;
    }
    a { color: var(--teal); text-decoration: none; }
    header {
      background: var(--teal); color: #fff; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
    header a { color: #d1fae5; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 22px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    h2 { font-size: 16px; margin: 0 0 14px; color: var(--teal-dark); }
    .muted { color: var(--muted); font-size: 14px; }
    input, button {
      font-size: 14px; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border);
    }
    input { width: 100%; margin: 6px 0 14px; }
    button {
      background: var(--teal); color: #fff; border: none; cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: var(--teal-dark); }
    button.ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .keybox {
      background: #042f2e; color: #5eead4; padding: 14px; border-radius: 8px;
      word-break: break-all; font-family: ui-monospace, monospace; font-size: 13px;
    }
    .bar { background: var(--teal-light); border-radius: 999px; height: 8px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--teal); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row > .card { flex: 1; min-width: 240px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--teal-light); color: var(--teal-dark); }
    form.inline { display: flex; gap: 10px; align-items: flex-end; }
    form.inline input { margin-bottom: 0; }
  </style>
</head>
<body>
  <header>
    <span class="brand">⚡ Synapse</span>
    <nav>
      {% if user %}
        <span style="color:#d1fae5;margin-right:14px">{{ user.email }}</span>
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
      {% endif %}
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
