{% extends "base.html" %}
{% block title %}Log in — Synapse{% endblock %}
{% block body %}
<section class="section">
  <div class="auth-wrap">
    <div class="card">
      <div class="center">
        <div class="brand center" style="justify-content:center"><span class="logo">S</span> Synapse</div>
        <h2 style="font-size:24px;margin-top:14px">Welcome back</h2>
        <p class="muted">Log in to manage your API keys and MCP servers.</p>
      </div>
      {% if error %}<div class="alert tag off mt-2" style="display:block">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="mt-3">
        <div class="field"><label>Email</label><input class="input" type="email" name="email" required /></div>
        <div class="field"><label>Password</label><input class="input" type="password" name="password" required /></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>
      <p class="muted center mt-2">No account? <a href="/register" style="color:var(--accent)">Create one free</a></p>
    </div>
  </div>
</section>
{% endblock %}
