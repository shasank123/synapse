{% extends "base.html" %}
{% block title %}Sign up — Synapse{% endblock %}
{% block body %}
<section class="section">
  <div class="auth-wrap">
    <div class="card">
      <div class="center">
        <div class="brand center" style="justify-content:center"><span class="logo">S</span> Synapse</div>
        <h2 style="font-size:24px;margin-top:14px">Get started free</h2>
        <p class="muted">Create an account to generate API keys for the Synapse CLI.</p>
      </div>
      {% if error %}<div class="alert tag off mt-2" style="display:block">{{ error }}</div>{% endif %}
      <form method="post" action="/register" class="mt-3">
        <div class="field"><label>Full name</label><input class="input" name="full_name" /></div>
        <div class="field"><label>Email</label><input class="input" type="email" name="email" required /></div>
        <div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="6" /></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>
      <p class="muted center mt-2">Already have an account? <a href="/login" style="color:var(--accent)">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
